<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVM Machines | Management Analytics</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
        
        /* Header */
        .header { background: #161b22; padding: 25px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { color: #58a6ff; font-size: 24px; }

        /* Filters */
        .filter-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .dropdown { position: relative; }
        .drop-btn { width: 100%; padding: 12px; background: #21262d; color: white; border: 1px solid #30363d; border-radius: 8px; cursor: pointer; text-align: left; font-weight: 600; }
        .drop-btn:hover { background: #30363d; }
        .drop-menu { display: none; position: absolute; width: 100%; background: #161b22; border: 1px solid #30363d; z-index: 999; max-height: 300px; overflow-y: auto; border-radius: 8px; margin-top: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .show { display: block; }
        .opt { padding: 10px 15px; border-bottom: 1px solid #21262d; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.2s; }
        .opt:hover { background: #1f242c; }

        /* KPIs */
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
        .kpi-card { padding: 25px; border-radius: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .kpi-card span { display: block; font-size: 32px; font-weight: 800; margin-top: 10px; }
        .blue { background: linear-gradient(145deg, #05445e, #189ab4); }
        .green { background: linear-gradient(145deg, #1b4d3e, #2e8b57); }
        .purple { background: linear-gradient(145deg, #3c1361, #7c5295); }
        .orange { background: linear-gradient(145deg, #742a2a, #b33939); }

        /* Charts */
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .chart-card { background: #161b22; padding: 20px; border-radius: 12px; border: 1px solid #30363d; min-height: 400px; }
        .chart-card h3 { font-size: 14px; margin-bottom: 20px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>TVM Machines Performance Dashboard</h1>
            <p style="color: #8b949e;">Management View • Real-Time Pivot Analysis</p>
        </div>
        <div id="date-now" style="color: #58a6ff; font-weight: bold;"></div>
    </div>

    <div class="filter-bar">
        <div class="dropdown">
            <label style="font-size: 12px; margin-bottom: 5px; display: block;">FILTER BY BRANCH</label>
            <button class="drop-btn" onclick="toggle('bMenu')">Select Branches ▼</button>
            <div id="bMenu" class="drop-menu"></div>
        </div>
        <div class="dropdown">
            <label style="font-size: 12px; margin-bottom: 5px; display: block;">FILTER BY MACHINE MODEL</label>
            <button class="drop-btn" onclick="toggle('mMenu')">Select Machines ▼</button>
            <div id="mMenu" class="drop-menu"></div>
        </div>
    </div>

    <div class="kpi-grid">
        <div class="kpi-card blue">DISPATCHED <span id="k1">0</span></div>
        <div class="kpi-card green">INSTALLED <span id="k2">0</span></div>
        <div class="kpi-card purple">DEMOS <span id="k3">0</span></div>
        <div class="kpi-card orange">PENDING <span id="k4">0</span></div>
    </div>

    <div class="chart-grid">
        <div class="chart-card"><h3>Pivot 1: Machines Distributed by Branch</h3><canvas id="c1"></canvas></div>
        <div class="chart-card"><h3>Pivot 2: Customer Performance by Branch</h3><canvas id="c2"></canvas></div>
        <div class="chart-card"><h3>Pivot 3: Market Vertical (Type x Month)</h3><canvas id="c3"></canvas></div>
        <div class="chart-card"><h3>Pivot 4: Flow (Dispatch vs Install Month)</h3><canvas id="c4"></canvas></div>
    </div>

    <script>
        let raw = [], filtered = [], charts = {};
        document.getElementById('date-now').innerText = new Date().toLocaleDateString();

        async function loadData() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/tvmsales/tvmmachines/main/TVMMACHINES.csv');
                const csvData = await response.text();
                
                Papa.parse(csvData, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        // CRITICAL FIX: The "Nuclear" Grand Total Removal
                        // This removes any row that has "Total" anywhere in the branch string
                        raw = results.data.filter(row => 
                            row.branch && 
                            !row.branch.toLowerCase().includes('total')
                        );
                        filtered = [...raw];
                        initFilters();
                        updateDashboard();
                    }
                });
            } catch (err) { console.error("Data Load Error:", err); }
        }

        function initFilters() {
            const createOptions = (menuId, dataKey) => {
                const uniqueItems = [...new Set(raw.map(item => item[dataKey]).filter(Boolean))].sort();
                const menu = document.getElementById(menuId);
                menu.innerHTML = '';
                uniqueItems.forEach(val => {
                    const div = document.createElement('div');
                    div.className = 'opt';
                    div.innerHTML = `<input type="checkbox" value="${val}" checked> ${val}`;
                    div.onclick = (e) => {
                        if(e.target.tagName !== 'INPUT') {
                            const cb = div.querySelector('input');
                            cb.checked = !cb.checked;
                        }
                        syncFilters();
                    };
                    menu.appendChild(div);
                });
            };
            createOptions('bMenu', 'branch');
            createOptions('mMenu', 'im_descr');
        }

        function syncFilters() {
            const selectedBranches = Array.from(document.querySelectorAll('#bMenu input:checked')).map(i => i.value);
            const selectedMachines = Array.from(document.querySelectorAll('#mMenu input:checked')).map(i => i.value);
            
            filtered = raw.filter(r => 
                selectedBranches.includes(r.branch) && 
                selectedMachines.includes(r.im_descr)
            );
            updateDashboard();
        }

        function toggle(id) {
            const el = document.getElementById(id);
            const isShown = el.classList.contains('show');
            document.querySelectorAll('.drop-menu').forEach(m => m.classList.remove('show'));
            if(!isShown) el.classList.add('show');
        }

        function updateDashboard() {
            // KPI Logic
            const total = filtered.length;
            let inst = 0, demo = 0;
            filtered.forEach(r => {
                inst += parseFloat(r.installation || 0);
                demo += parseFloat(r.demo || 0);
            });
            
            document.getElementById('k1').innerText = total;
            document.getElementById('k2').innerText = Math.round(inst);
            document.getElementById('k3').innerText = Math.round(demo);
            document.getElementById('k4').innerText = total - Math.round(inst);

            // MANAGEMENT PIVOT VISUALS
            // Pivot 1: Machine Models x Branch
            drawChart('c1', r => `${r.im_descr} | ${r.branch}`, 'bar', '#58a6ff');
            
            // Pivot 2: Customer Performance x Branch
            drawChart('c2', r => `${r.party_name} (${r.branch})`, 'bar', '#bc8cff');
            
            // Pivot 3: Business Type x Month
            drawChart('c3', r => `${r.customer_type} - ${r['Dispatch month']}`, 'line', '#3fb950');
            
            // Pivot 4: Installation Lifecycle (Dispatch vs Installation Month)
            drawChart('c4', r => `D: ${r['Dispatch month']} → I: ${r.installation_month || 'N/A'}`, 'bar', '#f85149');
        }

        function drawChart(canvasId, pivotFn, type, color) {
            const counts = {};
            filtered.forEach(r => {
                const label = pivotFn(r);
                counts[label] = (counts[label] || 0) + 1;
            });

            const topData = Object.entries(counts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10);

            const ctx = document.getElementById(canvasId).getContext('2d');
            if(charts[canvasId]) charts[canvasId].destroy();

            charts[canvasId] = new Chart(ctx, {
                type: type,
                data: {
                    labels: topData.map(d => d[0]),
                    datasets: [{
                        data: topData.map(d => d[1]),
                        backgroundColor: color + '99',
                        borderColor: color,
                        borderWidth: 2,
                        tension: 0.3,
                        fill: type === 'line'
                    }]
                },
                options: {
                    indexAxis: type === 'bar' ? 'y' : 'x',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#8b949e' } },
                        y: { grid: { color: '#30363d' }, ticks: { color: '#8b949e' } }
                    }
                }
            });
        }

        // Close menus on outside click
        window.onclick = (e) => {
            if(!e.target.closest('.dropdown')) {
                document.querySelectorAll('.drop-menu').forEach(m => m.classList.remove('show'));
            }
        };

        loadData();
    </script>
</body>
</html>
