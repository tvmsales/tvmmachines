<!DOCTYPE html>

<html lang="en"> <head> <meta charset="UTF-8"> <title>TVM Machines - Final Pivot Dashboard</title> <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script> <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script> <style> * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: 'Segoe UI', sans-serif; background: #0b0e14; color: white; padding: 20px; } .header { background: #1a1f2b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #30363d; } .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; } .drop-btn { width: 100%; padding: 12px; background: #1a1f2b; color: white; border: 1px solid #30363d; border-radius: 8px; cursor: pointer; text-align: left; } .drop-content { display: none; position: absolute; width: 100%; background: #1a1f2b; border: 1px solid #30363d; z-index: 10; max-height: 250px; overflow-y: auto; border-radius: 8px; margin-top: 5px; } .drop-content.show { display: block; } .opt { padding: 10px; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 10px; } .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; } .card { padding: 20px; border-radius: 12px; text-align: center; } .blue { background: #238636; } .purp { background: #8957e5; } .org { background: #da3633; } .teal { background: #1f6feb; } .val { font-size: 28px; display: block; font-weight: bold; } .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; } .chart-card { background: #161b22; padding: 20px; border-radius: 12px; border: 1px solid #30363d; } h3 { font-size: 14px; margin-bottom: 15px; color: #8b949e; text-transform: uppercase; } </style> </head> <body> <div class="header"> <h1>TVM Machines Pivot Engine</h1> <p style="color: #8b949e;">Grand Totals Automatically Excluded</p> </div>

<div class="filters">
    <div style="position:relative">
        <label>Branch Filter</label>
        <button class="drop-btn" onclick="toggle('branchDrop')">Filter Branches ▼</button>
        <div id="branchDrop" class="drop-content"></div>
    </div>
    <div style="position:relative">
        <label>Machine Name Filter</label>
        <button class="drop-btn" onclick="toggle('machineDrop')">Filter Machines ▼</button>
        <div id="machineDrop" class="drop-content"></div>
    </div>
</div>

<div class="kpis">
    <div class="card teal">DISPATCHED <span class="val" id="k1">0</span></div>
    <div class="card blue">INSTALLED <span class="val" id="k2">0</span></div>
    <div class="card purp">DEMOS <span class="val" id="k3">0</span></div>
    <div class="card org">PENDING <span class="val" id="k4">0</span></div>
</div>

<div class="charts">
    <div class="chart-card"><h3>Pivot 1: Machine x Branch</h3><canvas id="c1"></canvas></div>
    <div class="chart-card"><h3>Pivot 2: Customer x Type x Branch</h3><canvas id="c2"></canvas></div>
    <div class="chart-card"><h3>Pivot 3: Vertical (Type x Month)</h3><canvas id="c3"></canvas></div>
    <div class="chart-card"><h3>Pivot 4: Installation Flow Tracker</h3><canvas id="c4"></canvas></div>
</div>

<script>
    let raw = [], filtered = [], charts = {}, activeF = { branch: [], machine: [] };

    async function init() {
        const res = await fetch('https://raw.githubusercontent.com/tvmsales/tvmmachines/main/TVMMACHINES.csv');
        const csv = await res.text();
        Papa.parse(csv, {
            header: true, skipEmptyLines: true,
            complete: function(results) {
                // THE CORE FIX: Remove "Grand Total" by checking if the word "total" exists at all
                raw = results.data.filter(r => 
                    r.branch && 
                    !r.branch.toLowerCase().includes('total')
                );
                filtered = [...raw];
                createFilters();
                update();
            }
        });
    }

    function createFilters() {
        const fill = (id, key) => {
            const vals = [...new Set(raw.map(x => x[key]).filter(Boolean))].sort();
            const div = document.getElementById(id);
            vals.forEach(v => {
                activeF[id === 'branchDrop' ? 'branch' : 'machine'].push(v);
                div.innerHTML += `<div class="opt"><input type="checkbox" value="${v}" checked onchange="sync()"> ${v}</div>`;
            });
        };
        fill('branchDrop', 'branch');
        fill('machineDrop', 'im_descr');
    }

    function sync() {
        const b = Array.from(document.querySelectorAll('#branchDrop input:checked')).map(i => i.value);
        const m = Array.from(document.querySelectorAll('#machineDrop input:checked')).map(i => i.value);
        filtered = raw.filter(r => b.includes(r.branch) && m.includes(r.im_descr));
        update();
    }

    function toggle(id) { document.getElementById(id).classList.toggle('show'); }

    function update() {
        // KPIs
        document.getElementById('k1').innerText = filtered.length;
        let inst = 0, demo = 0;
        filtered.forEach(r => {
            inst += parseFloat(r.installation || 0);
            demo += parseFloat(r.demo || 0);
        });
        document.getElementById('k2').innerText = Math.round(inst);
        document.getElementById('k3').innerText = Math.round(demo);
        document.getElementById('k4').innerText = filtered.length - Math.round(inst);

        // 4 Pivot Visuals (Multi-dimensional labels)
        render('c1', r => `${r.im_descr} | ${r.branch}`, 'bar', '#1f6feb');
        render('c2', r => `${r.party_name} (${r.customer_type}) - ${r.branch}`, 'bar', '#8957e5');
        render('c3', r => `${r.customer_type} [${r['Dispatch month']}]`, 'line', '#238636');
        render('c4', r => `Disp: ${r['Dispatch month']} → Inst: ${r.installation_month || 'N/A'}`, 'bar', '#da3633');
    }

    function render(id, keyFn, type, color) {
        const counts = {};
        filtered.forEach(r => { const k = keyFn(r); counts[k] = (counts[k] || 0) + 1; });
        const data = Object.entries(counts).sort((a,b) => b[1] - a[1]).slice(0, 10);
        
        const ctx = document.getElementById(id).getContext('2d');
        if(charts[id]) charts[id].destroy();
        charts[id] = new Chart(ctx, {
            type: type,
            data: {
                labels: data.map(d => d[0]),
                datasets: [{ data: data.map(d => d[1]), backgroundColor: color }]
            },
            options: {
                indexAxis: type === 'bar' ? 'y' : 'x',
                plugins: { legend: { display: false } },
                scales: {
                    y: { ticks: { color: '#8b949e', font: { size: 10 } } },
                    x: { ticks: { color: '#8b949e', font: { size: 10 } } }
                }
            }
        });
    }
    init();
</script>
</body> </html>
