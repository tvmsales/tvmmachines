<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TVM Machines - Final Pivot Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #0b0e14; color: white; padding: 20px; }
        .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 20px 0; }
        .card { padding: 20px; border-radius: 12px; text-align: center; font-weight: bold; border: 1px solid #30363d; }
        .blue { background: #1f6feb; } .green { background: #238636; } .purp { background: #8957e5; } .org { background: #da3633; }
        .filters { display: flex; gap: 20px; background: #161b22; padding: 20px; border-radius: 12px; border: 1px solid #30363d; }
        .drop-content { position: absolute; background: #1a1f2b; border: 1px solid #30363d; display: none; max-height: 200px; overflow-y: auto; width: 250px; z-index: 100; padding: 10px; border-radius: 8px; }
        .show { display: block; }
        .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .chart-card { background: #161b22; padding: 20px; border-radius: 12px; border: 1px solid #30363d; }
        button { padding: 10px; background: #21262d; color: white; border: 1px solid #30363d; cursor: pointer; border-radius: 6px; }
    </style>
</head>
<body>
    <h1>TVM Pivot Dashboard</h1>
    <div class="filters">
        <div style="position:relative">
            <button onclick="document.getElementById('bDrop').classList.toggle('show')">Select Branch ▼</button>
            <div id="bDrop" class="drop-content"></div>
        </div>
        <div style="position:relative">
            <button onclick="document.getElementById('mDrop').classList.toggle('show')">Select Machine ▼</button>
            <div id="mDrop" class="drop-content"></div>
        </div>
    </div>

    <div class="kpis">
        <div class="card blue">DISPATCHED <span id="k1" style="display:block; font-size:24px">0</span></div>
        <div class="card green">INSTALLED <span id="k2" style="display:block; font-size:24px">0</span></div>
        <div class="card purp">DEMOS <span id="k3" style="display:block; font-size:24px">0</span></div>
        <div class="card org">PENDING <span id="k4" style="display:block; font-size:24px">0</span></div>
    </div>

    <div class="charts">
        <div class="chart-card"><h3>Pivot 1: Machine x Branch</h3><canvas id="c1"></canvas></div>
        <div class="chart-card"><h3>Pivot 2: Customer x Branch</h3><canvas id="c2"></canvas></div>
        <div class="chart-card"><h3>Pivot 3: Vertical (Type x Month)</h3><canvas id="c3"></canvas></div>
        <div class="chart-card"><h3>Pivot 4: Installation Status</h3><canvas id="c4"></canvas></div>
    </div>

    <script>
        let raw = [], filtered = [], charts = {};

        async function init() {
            const res = await fetch('https://raw.githubusercontent.com/tvmsales/tvmmachines/main/TVMMACHINES.csv');
            const csv = await res.text();
            Papa.parse(csv, {
                header: true, skipEmptyLines: true,
                complete: function(results) {
                    // THE NUCLEAR FIX: Remove "Grand Total" by checking if word "total" is in branch
                    raw = results.data.filter(r => r.branch && !r.branch.toLowerCase().includes('total'));
                    filtered = [...raw];
                    makeFilters();
                    update();
                }
            });
        }

        function makeFilters() {
            const setup = (id, key) => {
                const vals = [...new Set(raw.map(x => x[key]))].sort();
                const div = document.getElementById(id);
                vals.forEach(v => {
                    div.innerHTML += `<div style="padding:5px"><input type="checkbox" value="${v}" checked onchange="sync()"> ${v}</div>`;
                });
            };
            setup('bDrop', 'branch');
            setup('mDrop', 'im_descr');
        }

        function sync() {
            const b = Array.from(document.querySelectorAll('#bDrop input:checked')).map(i => i.value);
            const m = Array.from(document.querySelectorAll('#mDrop input:checked')).map(i => i.value);
            filtered = raw.filter(r => b.includes(r.branch) && m.includes(r.im_descr));
            update();
        }

        function update() {
            document.getElementById('k1').innerText = filtered.length;
            let inst = 0, demo = 0;
            filtered.forEach(r => { inst += parseFloat(r.installation || 0); demo += parseFloat(r.demo || 0); });
            document.getElementById('k2').innerText = Math.round(inst);
            document.getElementById('k3').innerText = Math.round(demo);
            document.getElementById('k4').innerText = filtered.length - Math.round(inst);

            // REAL PIVOT LOGIC: Grouping by two columns at once
            plot('c1', r => `${r.im_descr} | ${r.branch}`, 'bar', '#1f6feb');
            plot('c2', r => `${r.party_name} (${r.branch})`, 'bar', '#8957e5');
            plot('c3', r => `${r.customer_type} - ${r['Dispatch month']}`, 'line', '#238636');
            plot('c4', r => `Disp: ${r['Dispatch month']} → Inst: ${r.installation_month || 'N/A'}`, 'bar', '#da3633');
        }

        function plot(id, keyFn, type, color) {
            const counts = {};
            filtered.forEach(r => { const k = keyFn(r); counts[k] = (counts[k] || 0) + 1; });
            const data = Object.entries(counts).sort((a,b) => b[1] - a[1]).slice(0, 10);
            const ctx = document.getElementById(id).getContext('2d');
            if(charts[id]) charts[id].destroy();
            charts[id] = new Chart(ctx, {
                type: type,
                data: { labels: data.map(d => d[0]), datasets: [{ data: data.map(d => d[1]), backgroundColor: color }] },
                options: { indexAxis: type === 'bar' ? 'y' : 'x', plugins: { legend: { display: false } } }
            });
        }
        init();
    </script>
</body>
</html>
