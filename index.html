<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVM Machines - Multi-Dimensional Pivot Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        /* Preserving all your original styling for the professional look */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); min-height: 100vh; padding: 20px; color: white; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; background: rgba(99, 102, 241, 0.15); padding: 25px 35px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.3); backdrop-filter: blur(10px); }
        .logo { width: 60px; height: 60px; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
        h1 { font-size: 2.5em; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .filters-section { background: rgba(99, 102, 241, 0.1); padding: 30px; border-radius: 20px; margin-bottom: 30px; border: 1px solid rgba(139, 92, 246, 0.2); }
        .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .multi-select-button { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(139, 92, 246, 0.3); background: rgba(30, 27, 75, 0.6); color: white; cursor: pointer; text-align: left; display: flex; justify-content: space-between; }
        .multi-select-dropdown { display: none; position: absolute; background: #1a1535; border: 1px solid #8b5cf6; border-radius: 10px; max-height: 300px; overflow-y: auto; z-index: 1000; width: 100%; }
        .multi-select-dropdown.show { display: block; }
        .option { padding: 10px; display: flex; align-items: center; gap: 10px; color: white; cursor: pointer; }
        .kpi-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .kpi-card { padding: 20px; border-radius: 15px; text-align: center; border: 2px solid rgba(255,255,255,0.1); }
        .kpi-card.blue { background: linear-gradient(135deg, #667eea, #764ba2); }
        .kpi-card.green { background: linear-gradient(135deg, #56ab2f, #a8e063); }
        .kpi-card.purple { background: linear-gradient(135deg, #d53369, #daae51); }
        .kpi-card.orange { background: linear-gradient(135deg, #f857a6, #ff5858); }
        .charts-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 25px; }
        .chart-card { background: rgba(99, 102, 241, 0.1); padding: 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); }
    </style>
</head>
<body>
    <div class="header">
        <div style="display: flex; align-items: center; gap: 20px;">
            <div class="logo">🏭</div>
            <div>
                <h1>TVM-MACHINES Pivot Analytics</h1>
                <p style="color: #60a5fa;">Designed by Prasad K</p>
            </div>
        </div>
    </div>

    <div class="filters-section">
        <div class="filters">
            <div style="position:relative">
                <label>Branch</label>
                <button class="multi-select-button" onclick="toggleDropdown('branch')"><span id="branchText">All Selected</span><span>▼</span></button>
                <div id="branchDropdown" class="multi-select-dropdown"></div>
            </div>
            <div style="position:relative">
                <label>Machine Name</label>
                <button class="multi-select-button" onclick="toggleDropdown('machine')"><span id="machineText">All Selected</span><span>▼</span></button>
                <div id="machineDropdown" class="multi-select-dropdown"></div>
            </div>
        </div>
    </div>

    <div class="kpi-container">
        <div class="kpi-card blue"><div>Total Dispatched</div><div id="totalDispatched" style="font-size: 2em; font-weight: bold;">0</div></div>
        <div class="kpi-card green"><div>Installations</div><div id="totalInstallations" style="font-size: 2em; font-weight: bold;">0</div></div>
        <div class="kpi-card purple"><div>Demos</div><div id="totalDemos" style="font-size: 2em; font-weight: bold;">0</div></div>
        <div class="kpi-card orange"><div>Pending</div><div id="pendingInstallations" style="font-size: 2em; font-weight: bold;">0</div></div>
    </div>

    <div class="charts-container">
        <div class="chart-card"><div style="color: #c4b5fd; margin-bottom: 15px;">Pivot 1: Machine Name x Branch</div><canvas id="chart1"></canvas></div>
        <div class="chart-card"><div style="color: #c4b5fd; margin-bottom: 15px;">Pivot 2: Customer Name x Type x Branch</div><canvas id="chart2"></canvas></div>
        <div class="chart-card"><div style="color: #c4b5fd; margin-bottom: 15px;">Pivot 3: Vertical (Customer Type x Month)</div><canvas id="chart3"></canvas></div>
        <div class="chart-card"><div style="color: #c4b5fd; margin-bottom: 15px;">Pivot 4: Status (Dispatch vs Installation)</div><canvas id="chart4"></canvas></div>
    </div>

    <script>
        let allData = [];
        let filteredData = [];
        let charts = {};
        const filters = { branch: [], machine: [] };

        async function loadData() {
            const response = await fetch('https://raw.githubusercontent.com/tvmsales/tvmmachines/main/TVMMACHINES.csv');
            const csvText = await response.text();
            Papa.parse(csvText, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    // CRITICAL FIX: EXPLICITLY REMOVE "GRAND TOTAL" FROM DATASET
                    allData = results.data.filter(row => 
                        row.branch && 
                        !row.branch.toLowerCase().includes('total') && 
                        !row.branch.toLowerCase().includes('grand')
                    );
                    filteredData = [...allData];
                    initFilters();
                    updateDashboard();
                }
            });
        }

        function initFilters() {
            const branches = [...new Set(allData.map(d => d.branch))].sort();
            const machines = [...new Set(allData.map(d => d.im_descr))].sort();
            
            fill('branch', branches);
            fill('machine', machines);
        }

        function fill(id, options) {
            const container = document.getElementById(id + 'Dropdown');
            options.forEach(opt => {
                filters[id].push(opt);
                const div = document.createElement('div');
                div.className = 'option';
                div.innerHTML = `<input type="checkbox" checked onchange="updateF('${id}', '${opt}', this.checked)"> ${opt}`;
                container.appendChild(div);
            });
        }

        function updateF(id, val, checked) {
            if(checked) filters[id].push(val);
            else filters[id] = filters[id].filter(v => v !== val);
            filteredData = allData.filter(r => filters.branch.includes(r.branch) && filters.machine.includes(r.im_descr));
            updateDashboard();
        }

        function toggleDropdown(id) {
            document.getElementById(id + 'Dropdown').classList.toggle('show');
        }

        function updateDashboard() {
            document.getElementById('totalDispatched').innerText = filteredData.length;
            let inst = 0, demo = 0;
            filteredData.forEach(r => {
                inst += parseFloat(r.installation || 0);
                demo += parseFloat(r.demo || 0);
            });
            document.getElementById('totalInstallations').innerText = Math.round(inst);
            document.getElementById('totalDemos').innerText = Math.round(demo);
            document.getElementById('pendingInstallations').innerText = filteredData.length - Math.round(inst);

            // ACTUAL PIVOT LOGIC (Combining multiple dimensions)
            renderPivot('chart1', r => `${r.im_descr} | ${r.branch}`, 'bar', '#667eea');
            renderPivot('chart2', r => `${r.party_name} (${r.customer_type}) - ${r.branch}`, 'bar', '#a855f7');
            renderPivot('chart3', r => `${r.customer_type} [${r['Dispatch month']}]`, 'line', '#f5576c');
            renderPivot('chart4', r => `Disp: ${r['Dispatch month']} → Inst: ${r.installation_month || 'Pending'}`, 'bar', '#a8e063');
        }

        function renderPivot(id, keyFn, type, color) {
            const counts = {};
            filteredData.forEach(r => { const k = keyFn(r); counts[k] = (counts[k] || 0) + 1; });
            const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]).slice(0, 10);
            
            const ctx = document.getElementById(id).getContext('2d');
            if(charts[id]) charts[id].destroy();
            charts[id] = new Chart(ctx, {
                type: type,
                data: {
                    labels: sorted.map(s => s[0]),
                    datasets: [{ data: sorted.map(s => s[1]), backgroundColor: color + 'CC', borderColor: color, borderWidth: 1 }]
                },
                options: { indexAxis: type === 'bar' ? 'y' : 'x', plugins: { legend: { display: false } } }
            });
        }

        loadData();
    </script>
</body>
</html>
