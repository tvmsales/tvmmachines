<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVM Machines - Ultimate Pivot Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh; padding: 20px; color: white;
        }
        .header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 30px; background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(168, 85, 247, 0.15) 100%);
            padding: 25px 35px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.3);
            backdrop-filter: blur(10px);
        }
        .logo { width: 60px; height: 60px; background: linear-gradient(135deg, #f093fb, #f5576c); border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
        h1 { font-size: 2.2em; background: linear-gradient(135deg, #fff, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .filters-section { background: rgba(99, 102, 241, 0.1); padding: 25px; border-radius: 20px; margin-bottom: 30px; border: 1px solid rgba(139, 92, 246, 0.2); }
        .filters-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        
        .multi-select-wrapper { position: relative; }
        .multi-select-button {
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(139, 92, 246, 0.3);
            background: rgba(30, 27, 75, 0.6); color: white; cursor: pointer; display: flex; justify-content: space-between;
        }
        .multi-select-dropdown {
            display: none; position: absolute; top: 110%; left: 0; right: 0; background: #1a1535;
            border: 1px solid #8b5cf6; border-radius: 12px; max-height: 250px; overflow-y: auto; z-index: 9999;
        }
        .multi-select-dropdown.show { display: block; }
        .option { padding: 10px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .option:hover { background: rgba(139, 92, 246, 0.2); }

        .kpi-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .kpi-card { padding: 25px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1); transition: transform 0.3s; }
        .kpi-card:hover { transform: translateY(-5px); }
        .kpi-card.blue { background: linear-gradient(135deg, #667eea, #764ba2); }
        .kpi-card.green { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .kpi-card.purple { background: linear-gradient(135deg, #8e2de2, #4a00e0); }
        .kpi-card.orange { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .kpi-value { font-size: 2.2em; font-weight: 800; }

        .charts-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); gap: 25px; }
        .chart-card { background: rgba(99, 102, 241, 0.05); padding: 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); backdrop-filter: blur(10px); }
        .chart-title { color: #c4b5fd; font-weight: 600; margin-bottom: 20px; font-size: 1.1em; }
    </style>
</head>
<body>
    <div class="header">
        <div style="display: flex; align-items: center; gap: 20px;">
            <div class="logo">📊</div>
            <div>
                <h1>TVM-MACHINES Pivot Analytics</h1>
                <p style="color: #a78bfa;">Designed by Prasad K • Real-Time Pivot Engine</p>
            </div>
        </div>
    </div>

    <div class="filters-section">
        <div class="filters-grid">
            <div class="multi-select-wrapper">
                <label style="display:block; margin-bottom:5px; color:#a78bfa; font-size:0.9em;">Branch (Cleaned)</label>
                <button class="multi-select-button" onclick="toggleDropdown('branch')"><span id="branchBtn">All Selected</span><span>▼</span></button>
                <div id="branchDropdown" class="multi-select-dropdown"></div>
            </div>
            <div class="multi-select-wrapper">
                <label style="display:block; margin-bottom:5px; color:#a78bfa; font-size:0.9em;">Machine Name</label>
                <button class="multi-select-button" onclick="toggleDropdown('machine')"><span id="machineBtn">All Selected</span><span>▼</span></button>
                <div id="machineDropdown" class="multi-select-dropdown"></div>
            </div>
        </div>
    </div>

    <div class="kpi-container">
        <div class="kpi-card blue"><div>TOTAL DISPATCHED</div><div class="kpi-value" id="dispVal">0</div></div>
        <div class="kpi-card green"><div>INSTALLATIONS</div><div class="kpi-value" id="instVal">0</div></div>
        <div class="kpi-card purple"><div>TOTAL DEMOS</div><div class="kpi-value" id="demoVal">0</div></div>
        <div class="kpi-card orange"><div>PENDING</div><div class="kpi-value" id="pendVal">0</div></div>
    </div>

    <div class="charts-container">
        <div class="chart-card"><div class="chart-title">Pivot 1: Machine Models by Branch</div><canvas id="chart1"></canvas></div>
        <div class="chart-card"><div class="chart-title">Pivot 2: Top Customers [Branch Level]</div><canvas id="chart2"></canvas></div>
        <div class="chart-card"><div class="chart-title">Pivot 3: Vertical Trend (Type x Month)</div><canvas id="chart3"></canvas></div>
        <div class="chart-card"><div class="chart-title">Pivot 4: Flow Tracker (Dispatch vs Install)</div><canvas id="chart4"></canvas></div>
    </div>

    <script>
        let rawData = [], filteredData = [], charts = {}, activeFilters = { branch: [], machine: [] };

        async function loadData() {
            const response = await fetch('https://raw.githubusercontent.com/tvmsales/tvmmachines/main/TVMMACHINES.csv');
            const csvText = await response.text();
            Papa.parse(csvText, {
                header: true, skipEmptyLines: true,
                complete: function(results) {
                    // STEP 1: REMOVE GRAND TOTAL IMMEDIATELY
                    rawData = results.data.filter(row => 
                        row.branch && !row.branch.toLowerCase().includes('total')
                    );
                    filteredData = [...rawData];
                    initFilters();
                    updateDashboard();
                }
            });
        }

        function initFilters() {
            const createFilter = (id, field) => {
                const unique = [...new Set(rawData.map(r => r[field]).filter(Boolean))].sort();
                const container = document.getElementById(id + 'Dropdown');
                container.innerHTML = '';
                unique.forEach(val => {
                    activeFilters[id].push(val);
                    const div = document.createElement('div');
                    div.className = 'option';
                    div.innerHTML = `<input type="checkbox" value="${val}" checked onchange="handleSync('${id}')"> ${val}`;
                    container.appendChild(div);
                });
            };
            createFilter('branch', 'branch');
            createFilter('machine', 'im_descr');
        }

        function handleSync(id) {
            const checked = Array.from(document.querySelectorAll(`#${id}Dropdown input:checked`)).map(i => i.value);
            activeFilters[id] = checked;
            document.getElementById(id + 'Btn').innerText = checked.length + " Selected";
            
            // RE-FILTER DATA
            filteredData = rawData.filter(r => 
                activeFilters.branch.includes(r.branch) && 
                activeFilters.machine.includes(r.im_descr)
            );
            updateDashboard();
        }

        function toggleDropdown(id) {
            document.querySelectorAll('.multi-select-dropdown').forEach(d => {
                if(d.id !== id + 'Dropdown') d.classList.remove('show');
            });
            document.getElementById(id + 'Dropdown').classList.toggle('show');
        }

        function updateDashboard() {
            // RE-CALCULATE KPIs
            document.getElementById('dispVal').innerText = filteredData.length;
            let i = 0, d = 0;
            filteredData.forEach(row => {
                i += parseFloat(row.installation || 0);
                d += parseFloat(row.demo || 0);
            });
            document.getElementById('instVal').innerText = Math.round(i);
            document.getElementById('demoVal').innerText = Math.round(d);
            document.getElementById('pendVal').innerText = filteredData.length - Math.round(i);

            // RE-RENDER ALL 4 PIVOT CHARTS
            renderChart('chart1', r => `${r.im_descr} | ${r.branch}`, 'bar', '#667eea');
            renderChart('chart2', r => `${r.party_name} (${r.branch})`, 'bar', '#a855f7');
            renderChart('chart3', r => `${r.customer_type} - ${r['Dispatch month']}`, 'line', '#f5576c');
            renderChart('chart4', r => `Disp: ${r['Dispatch month']} ➔ Inst: ${r.installation_month || 'N/A'}`, 'bar', '#48bb78');
        }

        function renderChart(canvasId, pivotKeyFn, chartType, themeColor) {
            const pivotCounts = {};
            filteredData.forEach(row => {
                const key = pivotKeyFn(row);
                pivotCounts[key] = (pivotCounts[key] || 0) + 1;
            });

            const sorted = Object.entries(pivotCounts).sort((a,b) => b[1] - a[1]).slice(0, 10);
            const ctx = document.getElementById(canvasId).getContext('2d');
            
            if(charts[canvasId]) charts[canvasId].destroy();
            
            charts[canvasId] = new Chart(ctx, {
                type: chartType,
                data: {
                    labels: sorted.map(s => s[0]),
                    datasets: [{
                        data: sorted.map(s => s[1]),
                        backgroundColor: themeColor + 'CC',
                        borderColor: themeColor,
                        borderWidth: 2,
                        tension: 0.4,
                        fill: chartType === 'line'
                    }]
                },
                options: {
                    indexAxis: chartType === 'bar' ? 'y' : 'x',
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { ticks: { color: '#c4b5fd', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        x: { ticks: { color: '#c4b5fd', font: { size: 10 } } }
                    }
                }
            });
        }

        // Close dropdowns when clicking outside
        window.onclick = (e) => {
            if(!e.target.closest('.multi-select-wrapper')) {
                document.querySelectorAll('.multi-select-dropdown').forEach(d => d.classList.remove('show'));
            }
        };

        loadData();
    </script>
</body>
</html>
