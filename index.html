<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TVM Analytics - Management Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; padding: 10px; }
        .header { background: #161b22; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        .filters { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 10px; background: #161b22; padding: 12px; border-radius: 8px; border: 1px solid #30363d; }
        .drop-btn { width: 100%; padding: 8px; background: #21262d; color: white; border: 1px solid #30363d; border-radius: 6px; cursor: pointer; text-align: left; font-size: 11px; }
        .drop-content { display: none; position: absolute; width: 220px; background: #161b22; border: 1px solid #58a6ff; z-index: 1000; max-height: 350px; overflow-y: auto; border-radius: 6px; margin-top: 4px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); padding: 10px; }
        .search-box { width: 100%; padding: 6px; margin-bottom: 8px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 4px; font-size: 11px; position: sticky; top: 0; }
        .select-all-wrap { padding: 6px; border-bottom: 1px solid #30363d; margin-bottom: 5px; font-weight: bold; color: #58a6ff; font-size: 11px; }
        .show { display: block; }
        .opt { padding: 6px; border-bottom: 1px solid #21262d; display: flex; align-items: center; gap: 8px; font-size: 11px; cursor: pointer; }
        .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 10px; }
        .card { padding: 12px; border-radius: 8px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .val { font-size: 24px; display: block; font-weight: bold; }
        .blue { background: #1f6feb; } .green { background: #238636; } .purp { background: #8957e5; } .org { background: #da3633; }
        .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .chart-card { background: #161b22; padding: 15px; border-radius: 8px; border: 1px solid #30363d; height: 400px; overflow-y: auto; }
        .chart-title { font-size: 11px; margin-bottom: 8px; color: #8b949e; text-transform: uppercase; border-bottom: 1px solid #30363d; padding-bottom: 4px; font-weight: bold; }
        
        /* Table Styles */
        table { width: 100%; border-collapse: collapse; font-size: 12px; color: #c9d1d9; }
        th { text-align: left; background: #21262d; padding: 10px; border: 1px solid #30363d; color: #58a6ff; }
        td { padding: 10px; border: 1px solid #30363d; }
        tr:nth-child(even) { background: #0d1117; }
        .t-total { font-weight: bold; background: #238636 !important; color: white; }
    </style>
</head>
<body>

<div class="header">
    <h3>TVM ANALYTICS - MANAGEMENT DASHBOARD</h3>
    <div style="font-size: 10px; color: #7A1F2B;">● VERSION 3.0 - By Prasad K</div>
</div>

<div class="filters">
    <div style="position:relative"><button class="drop-btn" onclick="toggle('b')">BRANCH ▼</button><div id="b" class="drop-content"><input type="text" class="search-box" placeholder="Search..." onkeyup="fList('b')"><div class="select-all-wrap"><input type="checkbox" checked onclick="sAll('b', this)"> SELECT ALL</div><div class="list"></div></div></div>
    <div style="position:relative"><button class="drop-btn" onclick="toggle('m')">MACHINE ▼</button><div id="m" class="drop-content"><input type="text" class="search-box" placeholder="Search..." onkeyup="fList('m')"><div class="select-all-wrap"><input type="checkbox" checked onclick="sAll('m', this)"> SELECT ALL</div><div class="list"></div></div></div>
    <div style="position:relative"><button class="drop-btn" onclick="toggle('t')">CUST. TYPE ▼</button><div id="t" class="drop-content"><input type="text" class="search-box" placeholder="Search..." onkeyup="fList('t')"><div class="select-all-wrap"><input type="checkbox" checked onclick="sAll('t', this)"> SELECT ALL</div><div class="list"></div></div></div>
    <div style="position:relative"><button class="drop-btn" onclick="toggle('d')">DISPATCH ▼</button><div id="d" class="drop-content"><input type="text" class="search-box" placeholder="Search..." onkeyup="fList('d')"><div class="select-all-wrap"><input type="checkbox" checked onclick="sAll('d', this)"> SELECT ALL</div><div class="list"></div></div></div>
    <div style="position:relative"><button class="drop-btn" onclick="toggle('i')">INSTALL ▼</button><div id="i" class="drop-content"><input type="text" class="search-box" placeholder="Search..." onkeyup="fList('i')"><div class="select-all-wrap"><input type="checkbox" checked onclick="sAll('i', this)"> SELECT ALL</div><div class="list"></div></div></div>
</div>

<div class="kpis">
    <div class="card blue">DISPATCHED <span class="val" id="k1">0</span></div>
    <div class="card green">INSTALLED <span class="val" id="k2">0</span></div>
    <div class="card purp">DEMOS <span class="val" id="k3">0</span></div>
    <div class="card org">PENDING <span class="val" id="k4">0</span></div>
</div>

<div class="charts">
    <div class="chart-card"><div id="t_c1" class="chart-title">Visual 1</div><canvas id="c1"></canvas></div>
    <div class="chart-card"><div id="t_c2" class="chart-title">Visual 2</div><canvas id="c2"></canvas></div>
    <div class="chart-card"><div id="t_c3" class="chart-title">Visual 3</div><canvas id="c3"></canvas></div>
    <div class="chart-card">
        <div class="chart-title">Machine Installation Summary (Tabular)</div>
        <div id="table-container"></div>
    </div>
</div>

<script>
Chart.register(ChartDataLabels);
let raw = [], filtered = [], charts = {}, branchColors = { 
    'GJ':'#FF5733', 'KA':'#33FF57', 'MH':'#3357FF', 'TL':'#F333FF', 'TN':'#33FFF3', 'UP':'#FFF333', 'WB':'#FF3380' 
};

function parseMonth(s) {
    if(!s || s.toLowerCase().includes("not_entered")) return new Date(2099, 0);
    const months = {jan:0, feb:1, mar:2, apr:3, may:4, jun:5, jul:6, aug:7, sep:8, oct:9, nov:10, dec:11};
    const m = s.substring(0,3).toLowerCase();
    const y = parseInt("20" + s.substring(s.length - 2));
    return new Date(y, months[m] || 0);
}

async function start() {
    const res = await fetch('https://raw.githubusercontent.com/tvmsales/tvmmachines/main/TVMMACHINES.csv');
    const csv = await res.text();
    Papa.parse(csv, { header: true, skipEmptyLines: true, complete: function(r) {
        raw = r.data.map(row => {
            const cleanRow = {};
            Object.keys(row).forEach(key => {
                const k = key.trim().toLowerCase();
                const val = row[key] ? row[key].trim() : "";
                if (k === "branch") cleanRow.branch = val;
                if (k === "party_name") cleanRow.party_name = val;
                if (k.includes("im_descr")) cleanRow.im_descr = val;
                if (k.includes("customer_type")) cleanRow.customer_type = val;
                if (k.includes("dispatch month")) cleanRow.dispatch_month = val;
                if (k.includes("installation_month")) cleanRow.installation_month = val;
                if (k.includes("grand_total") || k === "grand total") cleanRow.grand_total = parseFloat(val) || 0;
            });
            return cleanRow;
        }).filter(x => x.branch && !/total/i.test(x.branch));
        
        setupFilter('b', 'branch');
        setupFilter('m', 'im_descr');
        setupFilter('t', 'customer_type');
        setupFilter('d', 'dispatch_month', true);
        setupFilter('i', 'installation_month', true);
        sync();
    }});
}

function setupFilter(id, key, isDate = false) {
    let vals = [...new Set(raw.map(x => x[key]).filter(v => v !== ''))];
    if (isDate) vals.sort((a, b) => parseMonth(a) - parseMonth(b)); else vals.sort();
    const container = document.querySelector(`#${id} .list`);
    vals.forEach(v => { container.innerHTML += `<div class="opt"><input type="checkbox" value="${v}" checked onchange="sync()"> ${v}</div>`; });
}

function sAll(id, el) {
    document.querySelectorAll(`#${id} .list input`).forEach(i => i.checked = el.checked);
    sync();
}

function fList(id) {
    const q = document.querySelector(`#${id} .search-box`).value.toLowerCase();
    document.querySelectorAll(`#${id} .opt`).forEach(opt => { opt.style.display = opt.innerText.toLowerCase().includes(q) ? 'flex' : 'none'; });
}

function sync() {
    const get = (id) => Array.from(document.querySelectorAll(`#${id} .list input:checked`)).map(i => i.value);
    const [b, m, t, d, i] = ['b', 'm', 't', 'd', 'i'].map(get);
    filtered = raw.filter(r => b.includes(r.branch) && m.includes(r.im_descr) && t.includes(r.customer_type) && d.includes(r.dispatch_month) && i.includes(r.installation_month));
    update();
}

function toggle(id) {
    const el = document.getElementById(id);
    const show = el.classList.contains('show');
    document.querySelectorAll('.drop-content').forEach(d => d.classList.remove('show'));
    if(!show) el.classList.add('show');
}

function update() {
    let dSum = 0, iSum = 0, demoSum = 0, pSum = 0;
    const monthlyStats = {};

    filtered.forEach(r => {
        const val = r.grand_total || 0;
        const im = (r.installation_month || "").toLowerCase();
        const dm = r.dispatch_month || "Unknown";
        
        dSum += val;
        if (!monthlyStats[dm]) monthlyStats[dm] = { disp: 0, inst: 0, pend: 0 };
        monthlyStats[dm].disp += val;

        const isI = im !== "" && im !== "install_date_not_entered" && im !== "install_date_not_ entered";
        if (isI) {
            iSum += val;
            monthlyStats[dm].inst += val;
        } else {
            pSum += val;
            monthlyStats[dm].pend += val;
        }
        if ((r.customer_type || "").toUpperCase().includes("DEMO")) demoSum += val;
    });

    document.getElementById('k1').innerText = Math.round(dSum);
    document.getElementById('k2').innerText = Math.round(iSum);
    document.getElementById('k3').innerText = Math.round(demoSum);
    document.getElementById('k4').innerText = Math.round(pSum);

    renderChart('c1', 'im_descr', 'Machine wise (by Branch)');
    renderChart('c2', 'party_name', 'Customer wise (by Branch)');
    renderChart('c3', 'customer_type', 'Vertical Trends (by Branch)');
    renderTable(monthlyStats);
}

function renderTable(data) {
    const sortedMonths = Object.keys(data).sort((a, b) => parseMonth(a) - parseMonth(b));
    let html = `<table><thead><tr><th>Dispatch Month</th><th>Dispatched</th><th>Installed</th><th>Pending</th></tr></thead><tbody>`;
    let tD = 0, tI = 0, tP = 0;

    sortedMonths.forEach(m => {
        const d = data[m];
        tD += d.disp; tI += d.inst; tP += d.pend;
        html += `<tr><td>${m}</td><td>${Math.round(d.disp)}</td><td>${Math.round(d.inst)}</td><td>${Math.round(d.pend)}</td></tr>`;
    });

    html += `<tr class="t-total"><td>GRAND TOTAL</td><td>${Math.round(tD)}</td><td>${Math.round(tI)}</td><td>${Math.round(tP)}</td></tr>`;
    html += `</tbody></table>`;
    document.getElementById('table-container').innerHTML = html;
}

function renderChart(canvasId, rowKey, baseTitle) {
    const selectedBranches = Array.from(document.querySelectorAll('#b .list input:checked')).map(i => i.value).sort();
    const rowTotals = {};
    filtered.forEach(r => {
        const key = r[rowKey];
        if (key) rowTotals[key] = (rowTotals[key] || 0) + r.grand_total;
    });
    const activeRows = Object.keys(rowTotals).sort((a, b) => rowTotals[b] - rowTotals[a]).slice(0, 10);
    document.getElementById('t_' + canvasId).innerText = `Top ${activeRows.length} ${baseTitle}`;

    const datasets = selectedBranches.map(br => ({
        label: br,
        data: activeRows.map(row => filtered.filter(r => r[rowKey] === row && r.branch === br).reduce((s, c) => s + c.grand_total, 0)),
        backgroundColor: branchColors[br] || '#58a6ff',
        datalabels: { color: '#000', formatter: (v) => v > 0 ? Math.round(v) : '' }
    }));

    const ctx = document.getElementById(canvasId).getContext('2d');
    if(charts[canvasId]) charts[canvasId].destroy();
    charts[canvasId] = new Chart(ctx, {
        type: 'bar',
        data: { labels: activeRows, datasets: datasets },
        options: {
            indexAxis: 'y', responsive: true, maintainAspectRatio: false,
            layout: { padding: { right: 40 } },
            plugins: {
                legend: { position: 'top', labels: { boxWidth: 8, color: '#8b949e', font: { size: 9 } } },
                datalabels: { font: { weight: 'bold', size: 10 } }
            },
            scales: {
                x: { stacked: true, ticks: { color: '#8b949e', font: { size: 9 } }, grid: { color: '#30363d' } },
                y: { stacked: true, ticks: { color: '#8b949e', font: { size: 9 } }, grid: { display: false } }
            }
        },
        plugins: [{
            id: 'chartTotals',
            afterDatasetsDraw(chart) {
                const { ctx, data } = chart;
                ctx.save(); ctx.font = 'bold 10px Segoe UI'; ctx.fillStyle = '#c9d1d9';
                data.labels.forEach((l, i) => {
                    let tot = 0, lX = 0;
                    data.datasets.forEach(ds => { tot += ds.data[i]; const m = chart.getDatasetMeta(data.datasets.indexOf(ds)); if (m.data[i]) lX = Math.max(lX, m.data[i].x); });
                    if (tot > 0) ctx.fillText(Math.round(tot), lX + 5, chart.getDatasetMeta(0).data[i].y + 4);
                });
                ctx.restore();
            }
        }]
    });
}
start();
</script>
</body>
</html>
